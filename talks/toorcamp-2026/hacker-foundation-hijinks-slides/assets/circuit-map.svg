<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Circuit path between ideas and resources</title>
  <desc id="desc">A stylized circuit board with glowing nodes connected by traces.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#69f5ff" stop-opacity=".85"/>
      <stop offset=".42" stop-color="#25bdd2" stop-opacity=".34"/>
      <stop offset="1" stop-color="#0f1720" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#59f2d5"/>
      <stop offset=".52" stop-color="#f1c15d"/>
      <stop offset="1" stop-color="#ff7966"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.28 0 0 0 0 0.94 0 0 0 0 0.91 0 0 0 .85 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#10171d"/>
  <path d="M0 705 C180 612 265 752 420 642 C570 535 625 270 810 312 C965 347 1016 535 1162 512 C1310 488 1378 300 1600 345" fill="none" stroke="#26323a" stroke-width="54" opacity=".52"/>
  <g opacity=".42" stroke="#33434c" stroke-width="3" fill="none">
    <path d="M75 112 H352 V244 H462"/>
    <path d="M126 788 H312 V694 H516"/>
    <path d="M522 95 V240 H672 V314"/>
    <path d="M1110 95 V268 H1292 V410 H1502"/>
    <path d="M1015 787 V650 H1168 V552"/>
    <path d="M1350 704 H1486 V595"/>
    <path d="M745 736 V620 H894 V495"/>
    <path d="M208 406 H388 V496 H580"/>
  </g>
  <g filter="url(#softGlow)" fill="none" stroke="url(#trace)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 642 H288 Q326 642 348 612 L437 490 Q459 460 494 460 H626 Q664 460 686 429 L792 282 Q815 250 855 250 H1012 Q1047 250 1068 278 L1194 446 Q1216 475 1252 475 H1455"/>
    <path d="M437 490 V602 H580"/>
    <path d="M792 282 V148 H950"/>
    <path d="M1194 446 V320 H1358"/>
    <path d="M1012 250 V392 H1108"/>
  </g>
  <g>
    <circle cx="118" cy="642" r="48" fill="url(#glow)"/>
    <circle cx="118" cy="642" r="15" fill="#e9fff9"/>
    <circle cx="437" cy="490" r="58" fill="url(#glow)"/>
    <circle cx="437" cy="490" r="17" fill="#e9fff9"/>
    <circle cx="792" cy="282" r="70" fill="url(#glow)"/>
    <circle cx="792" cy="282" r="20" fill="#e9fff9"/>
    <circle cx="1194" cy="446" r="64" fill="url(#glow)"/>
    <circle cx="1194" cy="446" r="18" fill="#e9fff9"/>
    <circle cx="1455" cy="475" r="50" fill="url(#glow)"/>
    <circle cx="1455" cy="475" r="15" fill="#e9fff9"/>
  </g>
  <g opacity=".72" fill="#f3f9f5" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">
    <text x="75" y="720">ideas</text>
    <text x="368" y="572">seed</text>
    <text x="724" y="380">support</text>
    <text x="1120" y="535">impact</text>
    <text x="1375" y="558">community</text>
  </g>
  <g opacity=".32" fill="#f3f9f5" font-family="Inter, Arial, sans-serif" font-size="18">
    <text x="75" y="760">researchers, founders, lurkers</text>
    <text x="368" y="610">public commitment</text>
    <text x="724" y="418">money, mentoring, trust</text>
    <text x="1120" y="573">disclosure, press, awareness</text>
    <text x="1375" y="596">the next project</text>
  </g>
</svg>
